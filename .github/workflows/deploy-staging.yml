name: Deploy Staging

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            # TODO: replace with actual path to backend on staging server
            cd /path/to/backend

            git pull origin staging
            npm ci --omit=dev

            # TODO: replace with actual PM2 process name on staging server
            pm2 restart coudradio-staging
