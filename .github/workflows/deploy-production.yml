name: Deploy Production

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262  # v1.0.3
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            # TODO: replace with actual path to backend on production server
            cd /path/to/backend

            git pull origin main
            npm ci --omit=dev

            # TODO: replace with actual PM2 process name on production server
            pm2 restart coudradio-backend
