name: Deploy Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            # TODO: replace with actual path to backend on production server
            cd /path/to/backend

            git pull origin main
            npm ci --omit=dev

            # TODO: replace with actual PM2 process name on production server
            pm2 restart coudradio-backend
